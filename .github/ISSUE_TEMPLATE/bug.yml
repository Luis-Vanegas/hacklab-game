name: Bug
description: Algo no funciona como debería
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: Qué pasó
      description: Describe el error y lo que esperabas que pasara.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Abrir el juego
        2. Escribir `ls -la`
        3. ...
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Navegador y sistema operativo
