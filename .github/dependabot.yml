version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    # Agrupa las actualizaciones menores para no llenar el repo de PRs
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # typescript-eslint 8.x solo soporta TypeScript <6.1.0: un salto mayor rompe npm install.
    # Quitar cuando typescript-eslint soporte TypeScript 7.
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
